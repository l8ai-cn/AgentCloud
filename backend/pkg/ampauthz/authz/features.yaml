      - agentscloud:member:invite
      - agentscloud:runner:manage
      - agentscloud:repo:manage
      - agentscloud:ai_resource:manage
  - code: AGENTSCLOUD_BILLING
    name: Billing
    type: FEATURE
    parentCode: AGENTSCLOUD_ROOT
    sort: 40
    permissions:
      - agentscloud:billing:manage
  - code: APP_WORKSPACE
    name: Account & roles
    type: FEATURE
    parentCode: AGENTSCLOUD_ROOT
    sort: 90
    permissions:
      - authz:application:view
      - authz:model:view
      - authz:app_role:view
