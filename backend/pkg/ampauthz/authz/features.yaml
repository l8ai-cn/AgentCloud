    name: Member workspace
    type: FEATURE
    parentCode: AGENTSCLOUD_ROOT
    sort: 20
    permissions:
      - agentscloud:pod:use
      - agentscloud:ticket:use
  - code: AGENTSCLOUD_ORG_ADMIN
    name: Organization administration
    type: FEATURE
    parentCode: AGENTSCLOUD_ROOT
    sort: 30
    permissions:
