        action: update
        riskLevel: L2
        approvalRequired: false
  - code: agentscloud:member
    name: Members
    scopes: [ALL]
    permissions:
      - code: agentscloud:member:invite
        action: manage
        riskLevel: L2
        approvalRequired: false
  - code: agentscloud:runner
    name: Runners
    scopes: [ALL]
    permissions:
      - code: agentscloud:runner:manage
        action: manage
        riskLevel: L2
        approvalRequired: false
  - code: agentscloud:billing
    name: Billing
    scopes: [ALL]
    permissions:
      - code: agentscloud:billing:manage
        action: manage
        riskLevel: L3
        approvalRequired: false
  - code: agentscloud:repo
    name: Repositories
    scopes: [ALL]
    permissions:
      - code: agentscloud:repo:manage
        action: manage
        riskLevel: L2
        approvalRequired: false
  - code: agentscloud:ai_resource
    name: AI resources
    scopes: [ALL]
    permissions:
      - code: agentscloud:ai_resource:manage
        action: manage
        riskLevel: L2
        approvalRequired: false
  - code: agentscloud:pod
    name: Pods
    scopes: [ALL]
    permissions:
      - code: agentscloud:pod:use
