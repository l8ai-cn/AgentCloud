# Oilan runtime overlay for the shared AgentCloud base chart.
# Namespace/secrets use agentcloud; Harbor image project stays agentsmesh for now.
namespace: agentcloud
imageTag: &releaseTag release-20260730
image:
  repository: docker.cnb.cool/l8ai/doworker/backend
  tag: *releaseTag
rolloutTokens:
  backend: oilan-20260730-amp-bearer-v2
  web: oilan-20260730-amp-bearer-v2
  relay: oilan-20260730-amp-bearer-v2
rolloutTokenDomain: agentcloud.l8ai.cn

imagePullSecrets:
  - name: agentcloud-regcred

backend:
  replicas: 1
  image:
    name: backend
    repository: docker.cnb.cool/l8ai/doworker/backend
  serviceAccountName: agentcloud-backend
  configMapName: agentcloud-config
  secrets:
    - agentcloud-secrets
    - agentcloud-gitea
  coordinatorOrgSlug: dev-org
  coordinatorRunnerImages: "video-studio=repo.aiedulab.cn:8443/agentcloud/runner-video-studio@sha256:f3463bc567f1ed8516486e95e17d50f48834275aae7931221b1a3eeb3c526a5d,e2e-echo=repo.aiedulab.cn:8443/agentcloud/runner-e2e-echo@sha256:077eb4511113ddb80dd8e09d7b46ffe3668d6b69d1840c1cbe849e97595087fa,do-agent=repo.aiedulab.cn:8443/agentcloud/runner-do-agent@sha256:7963f37ef3d07c949c595f18fb96ea3ac4c75d04748a901acc2adbae4ad755ff,seedance-expert=repo.aiedulab.cn:8443/agentcloud/runner-do-agent@sha256:7963f37ef3d07c949c595f18fb96ea3ac4c75d04748a901acc2adbae4ad755ff"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

web:
  replicas: 1
  image:
    name: web
    repository: docker.cnb.cool/l8ai/doworker/web
  primaryDomain: agents.l8ai.cn
  useHttps: "true"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

relay:
  replicas: 1
  image:
    name: relay
    repository: docker.cnb.cool/l8ai/doworker/relay
  configMapName: agentcloud-config
  secretsName: agentcloud-secrets
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

ingress:
  enabled: true
  agents:
    enabled: true
    host: agents.l8ai.cn
    loginAmp: true
