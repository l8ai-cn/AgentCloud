# Oilan runtime overlay for the shared AgentCloud base chart.
# Namespace/secrets use agentcloud; Harbor image project stays agentsmesh for now.
namespace: agentcloud
imageTag: &releaseTag release-20260730
image:
  repository: docker.cnb.cool/l8ai/doworker/backend
  tag: *releaseTag
rolloutTokens:
  backend: oilan-20260730-admin-consolidation
  web: oilan-20260730-admin-consolidation
  relay: oilan-20260730-amp-bearer-v2
rolloutTokenDomain: agentcloud.l8ai.cn

imagePullSecrets:
  - name: agentcloud-regcred

backend:
  replicas: 1
  image:
    name: backend
    repository: docker.cnb.cool/l8ai/doworker/backend
  serviceAccountName: agentcloud-backend
  configMapName: agentcloud-config
  secrets:
    - agentcloud-secrets
    - agentcloud-gitea
  coordinatorOrgSlug: dev-org
  coordinatorRunnerImages: "video-studio=repo.aiedulab.cn:8443/agentcloud/runner-video-studio@sha256:4f243b28b02b105659cf31af0f53aa49c01effc20df60080e5334cebafce8b5d,e2e-echo=repo.aiedulab.cn:8443/agentcloud/runner-e2e-echo@sha256:077eb4511113ddb80dd8e09d7b46ffe3668d6b69d1840c1cbe849e97595087fa,do-agent=repo.aiedulab.cn:8443/agentcloud/runner-do-agent@sha256:66338b96672152530f9a9c4611af9958d63f22b888598d857614f8974cb26ccd,seedance-expert=repo.aiedulab.cn:8443/agentcloud/runner-do-agent@sha256:66338b96672152530f9a9c4611af9958d63f22b888598d857614f8974cb26ccd"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

web:
  replicas: 1
  image:
    name: web
    repository: docker.cnb.cool/l8ai/doworker/web
  primaryDomain: agents.l8ai.cn
  useHttps: "true"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

relay:
  replicas: 1
  image:
    name: relay
    repository: docker.cnb.cool/l8ai/doworker/relay
  configMapName: agentcloud-config
  secretsName: agentcloud-secrets
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

ingress:
  enabled: true
  agents:
    enabled: true
    host: agents.l8ai.cn
    loginAmp: true
