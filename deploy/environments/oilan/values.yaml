# Oilan runtime overlay for the shared AgentsMesh base chart.
namespace: agentsmesh
imageTag: &releaseTag release-20260726
image:
  repository: repo.aiedulab.cn:8443/agentsmesh/backend
  tag: *releaseTag
rolloutTokens:
  backend: oilan-20260726-amp-authz
  web: oilan-20260726-amp-authz
  relay: oilan-20260726-amp-authz

imagePullSecrets:
  - name: agentsmesh-regcred

backend:
  replicas: 1
  image:
    name: backend
    repository: repo.aiedulab.cn:8443/agentsmesh/backend
  coordinatorOrgSlug: dev-org
  coordinatorRunnerImages: "video-studio=repo.aiedulab.cn:8443/agentsmesh/runner-video-studio@sha256:f3463bc567f1ed8516486e95e17d50f48834275aae7931221b1a3eeb3c526a5d,e2e-echo=repo.aiedulab.cn:8443/agentsmesh/runner-e2e-echo@sha256:077eb4511113ddb80dd8e09d7b46ffe3668d6b69d1840c1cbe849e97595087fa,do-agent=repo.aiedulab.cn:8443/agentsmesh/runner-do-agent@sha256:1792eaeb4f4da7fd103a54950893817077dd8986931422ad2a83e09bf4bac653,seedance-expert=repo.aiedulab.cn:8443/agentsmesh/runner-do-agent@sha256:1792eaeb4f4da7fd103a54950893817077dd8986931422ad2a83e09bf4bac653"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

web:
  replicas: 1
  image:
    name: web
    repository: repo.aiedulab.cn:8443/agentsmesh/web
  primaryDomain: agents.l8ai.cn
  useHttps: "true"

ingress:
  enabled: true
  agents:
    enabled: true
    host: agents.l8ai.cn
    loginAmp: true
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

relay:
  replicas: 1
  image:
    name: relay
    repository: repo.aiedulab.cn:8443/agentsmesh/relay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
