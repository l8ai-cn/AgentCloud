{{- if .Values.web.enabled }}
{{- $tag := required "imageTag is required" .Values.imageTag }}
{{- $repo := required "web.image.repository is required" .Values.web.image.repository }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.web.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentcloud.labels" . | nindent 4 }}
    app: {{ .Values.web.name }}
  annotations:
    kubernetes.io/change-cause: "agentcloud {{ $tag }}"
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.web.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.web.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.web.name }}
        {{- include "agentcloud.labels" . | nindent 8 }}
      annotations:
        {{ .Values.rolloutTokenDomain }}/rollout-token: {{ default (.Values.rolloutToken | default .Release.Revision) (get (default dict .Values.rolloutTokens) "web") | quote }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: {{ .Values.web.name }}
          image: {{ include "agentcloud.image" (dict "repository" $repo "tag" $tag) }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.web.service.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: PRIMARY_DOMAIN
              value: {{ .Values.web.primaryDomain | quote }}
            - name: USE_HTTPS
              value: {{ .Values.web.useHttps | quote }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.web.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.web.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentcloud.labels" . | nindent 4 }}
    app: {{ .Values.web.name }}
spec:
  selector:
    app: {{ .Values.web.name }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: {{ .Values.web.service.port }}
{{- end }}
