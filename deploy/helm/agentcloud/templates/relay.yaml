{{- if .Values.relay.enabled }}
{{- $tag := required "imageTag is required" .Values.imageTag }}
{{- $repo := required "relay.image.repository is required" .Values.relay.image.repository }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.relay.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentcloud.labels" . | nindent 4 }}
    app: {{ .Values.relay.name }}
  annotations:
    kubernetes.io/change-cause: "agentcloud {{ $tag }}"
spec:
  replicas: {{ .Values.relay.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.relay.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.relay.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.relay.name }}
        {{- include "agentcloud.labels" . | nindent 8 }}
      annotations:
        {{ .Values.rolloutTokenDomain }}/rollout-token: {{ default (.Values.rolloutToken | default .Release.Revision) (get (default dict .Values.rolloutTokens) "relay") | quote }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: {{ .Values.relay.name }}
          image: {{ include "agentcloud.image" (dict "repository" $repo "tag" $tag) }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.relay.service.port }}
          env:
            - name: SERVER_ADDRESS
              value: ":{{ .Values.relay.service.port }}"
            - name: BACKEND_URL
              value: "http://backend:8080"
            - name: PRIMARY_DOMAIN
              value: {{ .Values.web.primaryDomain | quote }}
            - name: PREVIEW_PUBLIC_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.relay.configMapName }}
                  key: PREVIEW_PUBLIC_ORIGIN
            - name: PREVIEW_COOKIE_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.relay.configMapName }}
                  key: PREVIEW_COOKIE_MODE
            - name: USE_HTTPS
              value: {{ .Values.web.useHttps | quote }}
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.relay.configMapName }}
                  key: RELAY_ALLOWED_ORIGINS
            - name: RELAY_ID
              value: k8s-relay-1
            - name: RELAY_REGION
              value: cluster-oilan
            - name: RELAY_CAPACITY
              value: "1000"
            - name: SESSION_KEEP_ALIVE_DURATION
              value: 30s
            - name: DEBUG
              value: "false"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.relay.secretsName }}
                  key: JWT_SECRET
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.relay.secretsName }}
                  key: INTERNAL_API_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.relay.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.relay.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.relay.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentcloud.labels" . | nindent 4 }}
    app: {{ .Values.relay.name }}
spec:
  selector:
    app: {{ .Values.relay.name }}
  ports:
    - port: {{ .Values.relay.service.port }}
      targetPort: {{ .Values.relay.service.port }}
{{- end }}
