apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentcloud-marketplace
  namespace: agentcloud
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["market.l8ai.cn"]
      secretName: l8ai-wildcard-tls
  rules:
    - host: market.l8ai.cn
      http:
        paths:
          - path: /api/marketplace/v1
            pathType: Prefix
            backend:
              service:
                name: marketplace
                port:
                  number: 8080
---
# Until web ships host middleware, edge-redirect the whole host. After the next
# web release, drop permanent-redirect so /apps|/listings path mapping in
# clients/web/src/middleware.ts can preserve listing slugs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentcloud-marketplace-ui
  namespace: agentcloud
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: "https://agents.l8ai.cn/marketplace"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["market.l8ai.cn"]
      secretName: l8ai-wildcard-tls
  rules:
    - host: market.l8ai.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
