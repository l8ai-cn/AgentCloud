apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: agentcloud
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: agentcloud-regcred
      containers:
        - name: web
          image: repo.aiedulab.cn:8443/agentcloud/web@sha256:a0d87f23781e5bdc8e2c333d14d5a3ca44d925dcf659baee60b5a736c2dc312f
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PRIMARY_DOMAIN
              value: "agents.l8ai.cn"
            - name: USE_HTTPS
              value: "true"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: agentcloud
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
