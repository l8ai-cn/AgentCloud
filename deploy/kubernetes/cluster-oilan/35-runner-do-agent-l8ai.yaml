apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runner-do-agent-l8ai-workspace
  namespace: agentcloud
  labels:
    app.kubernetes.io/name: agentsmesh-runner
    agentsmesh.io/runtime: do-agent
    agentsmesh.io/org: l8ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-do-agent-l8ai
  namespace: agentcloud
  labels:
    app.kubernetes.io/name: agentsmesh-runner
    agentsmesh.io/runtime: do-agent
    agentsmesh.io/org: l8ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runner-do-agent-l8ai
  template:
    metadata:
      labels:
        app: runner-do-agent-l8ai
        app.kubernetes.io/name: agentsmesh-runner
        agentsmesh.io/runtime: do-agent
        agentsmesh.io/org: l8ai
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: agentcloud-regcred
      containers:
        - name: runner
          image: repo.aiedulab.cn:8443/agentcloud/runner-do-agent@sha256:35d834c37816f1008df427623201ce4c25a4c68fc0dbfd368f9756519283813e
          imagePullPolicy: Always
          command: ["/usr/local/bin/runner-entrypoint.sh"]
          env:
            - name: HOME
              value: /home/runner
            - name: RUNNER_NODE_ID
              value: coord-runner-amesh-runner-2-do-agent
            - name: RUNNER_ORG_SLUG
              value: l8ai
            - name: AGENT_RUNTIME
              value: do-agent
            - name: DEFAULT_AGENT
              value: do-agent
            - name: BACKEND_URL
              value: http://backend:8080
            - name: GRPC_ENDPOINT
              value: backend:9090
            - name: RELAY_BASE_URL
              value: ws://relay:8090
            - name: MAX_CONCURRENT_PODS
              value: "100000"
            - name: SSL_DIR
              value: /app/ssl
          volumeMounts:
            - name: ssl
              mountPath: /app/ssl
              readOnly: true
            - name: home
              mountPath: /home/runner
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 100m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: ssl
          secret:
            secretName: agentcloud-pki-ca
        - name: home
          emptyDir: {}
        - name: workspace
          persistentVolumeClaim:
            claimName: runner-do-agent-l8ai-workspace
