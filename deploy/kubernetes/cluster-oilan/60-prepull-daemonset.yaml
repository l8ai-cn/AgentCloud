# Keeps runner images used by coordinator-launched Workers resident on every node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agentcloud-image-prepull
  namespace: agentcloud
spec:
  selector:
    matchLabels:
      app: agentcloud-image-prepull
  template:
    metadata:
      labels:
        app: agentcloud-image-prepull
    spec:
      imagePullSecrets:
        - name: agentcloud-regcred
      containers:
        - name: hold
          image: repo.aiedulab.cn:8443/agentcloud/runner-e2e-echo@sha256:077eb4511113ddb80dd8e09d7b46ffe3668d6b69d1840c1cbe849e97595087fa
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
        - name: do-agent
          image: repo.aiedulab.cn:8443/agentcloud/runner-do-agent@sha256:66338b96672152530f9a9c4611af9958d63f22b888598d857614f8974cb26ccd
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
        - name: video-studio
          image: repo.aiedulab.cn:8443/agentcloud/runner-video-studio@sha256:4f243b28b02b105659cf31af0f53aa49c01effc20df60080e5334cebafce8b5d
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
