apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: agentcloud
  annotations:
    kubernetes.io/change-cause: "Agent Cloud release __RELEASE_COMMIT__"
    agentcloud.ai/verified-image-digest: "__BACKEND_DIGEST__"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        agentcloud.ai/verified-image-digest: "__BACKEND_DIGEST__"
    spec:
      serviceAccountName: agentcloud-backend
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: agentcloud-regcred
      initContainers:
        - name: kubectl-install
          image: repo.aiedulab.cn:8443/agentcloud/kubectl:1.28
          imagePullPolicy: Always
          command: ["sh", "-c", "cp \"$(command -v kubectl)\" /kube-tools/kubectl && chmod +x /kube-tools/kubectl"]
          volumeMounts:
            - name: kube-tools
              mountPath: /kube-tools
      containers:
        - name: backend
          image: repo.aiedulab.cn:8443/agentcloud/backend@sha256:7e37405abf43a3a9ebc71bbd9c65f15acd1ef6960e0dffece6eb3b5c74e8e1bd
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: grpc
          envFrom:
            - configMapRef:
                name: agentcloud-config
            - secretRef:
                name: agentcloud-secrets
            - secretRef:
                name: agentcloud-gitea
          env:
            - name: COORDINATOR_RUNNER_LAUNCHER
              value: "k8s"
            - name: COORDINATOR_RUNNER_K8S_KUBECTL
              value: "/kube-tools/kubectl"
            - name: COORDINATOR_RUNNER_K8S_NAMESPACE
              value: "agentcloud"
            - name: COORDINATOR_RUNNER_K8S_IMAGE_PULL_POLICY
              value: "Always"
            - name: COORDINATOR_RUNNER_K8S_SSL_SECRET
              value: "agentcloud-pki-ca"
            - name: COORDINATOR_RUNNER_K8S_READY_TIMEOUT_SECONDS
              value: "180"
            - name: COORDINATOR_RUNNER_NODE_ID_PREFIX
              value: "coord-runner-"
            - name: COORDINATOR_RUNNER_ORG_SLUG
              value: "dev-org"
            - name: COORDINATOR_RUNNER_BACKEND_URL
              value: "http://backend:8080"
            - name: COORDINATOR_RUNNER_GRPC_ENDPOINT
              value: "backend:9090"
            - name: COORDINATOR_RUNNER_RELAY_BASE_URL
              value: "ws://relay:8090"
            - name: COORDINATOR_RUNNER_IMAGES
              value: "e2e-echo=repo.aiedulab.cn:8443/agentcloud/runner-e2e-echo@sha256:077eb4511113ddb80dd8e09d7b46ffe3668d6b69d1840c1cbe849e97595087fa,do-agent=repo.aiedulab.cn:8443/agentcloud/runner-do-agent@sha256:66338b96672152530f9a9c4611af9958d63f22b888598d857614f8974cb26ccd,seedance-expert=repo.aiedulab.cn:8443/agentcloud/runner-do-agent@sha256:66338b96672152530f9a9c4611af9958d63f22b888598d857614f8974cb26ccd,video-studio=repo.aiedulab.cn:8443/agentcloud/runner-video-studio@sha256:4f243b28b02b105659cf31af0f53aa49c01effc20df60080e5334cebafce8b5d"
          volumeMounts:
            - name: pki-ca
              mountPath: /app/ssl
              readOnly: true
            - name: access-token
              mountPath: /app/access-token
              readOnly: true
            - name: kube-tools
              mountPath: /kube-tools
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: pki-ca
          secret:
            secretName: agentcloud-pki-ca
        - name: access-token
          secret:
            secretName: agentcloud-access-token
        - name: kube-tools
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: agentcloud
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9090
      targetPort: 9090
      name: grpc
