# AgentCloud release-image CI.
# Git authority: https://cnb.cool/l8ai/agentcloud
# Registry (current): docker.cnb.cool/l8ai/doworker/<service>:release-YYYYMMDD
# Deployment stays on DoOps + Helm / cluster-oilan; GitHub does not publish business images.
".agentcloud-release-artifacts": &agentcloud-release-artifacts
  - name: agentcloud release artifacts
    runner:
      cpus: 8
    services:
      - docker
    docker:
      image: docker:27-cli
    stages:
      - name: 构建 AgentCloud 业务镜像
        script: |
          set -eu
          release_version="$(tr -d '[:space:]' < deploy/release-version.txt)"
          if ! printf '%s' "${release_version}" | grep -Eq '^release-[0-9]{8}$'; then
            echo "invalid deploy/release-version.txt: ${release_version}" >&2
            exit 64
          fi
          if [ -n "${CNB_TOKEN:-}" ] && [ -n "${CNB_TOKEN_USER_NAME:-}" ]; then
            printf '%s' "${CNB_TOKEN}" | docker login docker.cnb.cool \
              -u "${CNB_TOKEN_USER_NAME}" --password-stdin
          fi
          for service_dockerfile in \
            "backend:backend/Dockerfile" \
            "relay:relay/Dockerfile" \
            "web:clients/web/Dockerfile"
          do
            service="${service_dockerfile%%:*}"
            dockerfile="${service_dockerfile#*:}"
            image="docker.cnb.cool/l8ai/doworker/${service}:${release_version}"
            docker build \
              --platform linux/amd64 \
              --file "${dockerfile}" \
              --tag "${image}" \
              --label "org.opencontainers.image.revision=${CNB_COMMIT}" \
              --label "org.opencontainers.image.version=${release_version}" \
              --label "org.opencontainers.image.source=https://cnb.cool/l8ai/agentcloud" \
              --build-arg "CACHEBUST=${CNB_COMMIT}-${service}" \
              .
            docker push "${image}"
            printf 'AGENTCLOUD_SERVICE=%s:success image=%s revision=%s\n' \
              "${service}" "${image}" "${CNB_COMMIT}"
          done

main:
  push: *agentcloud-release-artifacts

"release/*":
  push: *agentcloud-release-artifacts

"release-*":
  push: *agentcloud-release-artifacts

"$":
  api_trigger: *agentcloud-release-artifacts
