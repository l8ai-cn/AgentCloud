name: Oilan Image Publish

# Retired: business images (backend/relay/web) are built by CNB.
# Git: https://cnb.cool/l8ai/agentcloud  (.cnb.yml)
# Registry: docker.cnb.cool/l8ai/doworker/<service>:release-YYYYMMDD
# Trigger: push to main / release-* or `cnb build start-build --repo l8ai/agentcloud --branch main --event api_trigger`

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Retired in favor of CNB
    runs-on: ubuntu-latest
    steps:
      - name: Point operators at CNB
        run: |
          set -euo pipefail
          cat <<'EOF' >&2
          GitHub oilan-image-publish is retired.
          Build AgentCloud business images on CNB:

            repo:     https://cnb.cool/l8ai/agentcloud
            pipeline: .cnb.yml
            images:   docker.cnb.cool/l8ai/doworker/{backend,relay,web}:release-YYYYMMDD

          Push main (or release-*) to cnb-agentcloud, or:

            cnb build start-build --repo l8ai/agentcloud --branch main --event api_trigger --sha <commit>
          EOF
          exit 64
